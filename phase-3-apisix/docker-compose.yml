version: "3"

services:
  apisix:
    image: apache/apisix:3.9.0-debian
    restart: always
    volumes:
      - ./apisix_config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080/tcp"    # Proxy HTTP
      - "9443:9443/tcp"    # Proxy HTTPS
      - "9180:9180/tcp"    # Admin API
    networks:
      - apisix

  etcd:
    image: bitnami/etcd:3.5.11
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - apisix

volumes:
  etcd_data:

networks:
  apisix:
    driver: bridge